name: deploy upload worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check worker
        run: node --check worker/worker.js

      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
          STORE_GITHUB_TOKEN: ${{ secrets.STORE_GITHUB_TOKEN }}
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID UPLOAD_PASSWORD STORE_GITHUB_TOKEN; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these in Settings > Secrets and variables > Actions, then re-run:$missing"
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          workingDirectory: worker
          command: deploy
          secrets: |
            UPLOAD_PASSWORD
            STORE_GITHUB_TOKEN
        env:
          UPLOAD_PASSWORD: ${{ secrets.UPLOAD_PASSWORD }}
          STORE_GITHUB_TOKEN: ${{ secrets.STORE_GITHUB_TOKEN }}
